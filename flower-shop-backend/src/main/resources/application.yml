spring:
  application:
    name: flower-shop-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${BACKEND_PORT:5303}
  servlet:
    context-path: /
  forward-headers-strategy: framework

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml

springdoc:
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn

flower:
  jwt:
    issuer: ${JWT_ISSUER:flower-shop}
    secret: ${JWT_SECRET}
    expire-seconds: ${JWT_EXPIRE_SECONDS:604800}
  upload:
    base-dir: ${UPLOAD_DIR:${user.dir}/uploads}
    public-prefix: ${UPLOAD_PUBLIC_PREFIX:/uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5302,http://127.0.0.1:5302}
  order:
    timeout-minutes: 30

logging:
  level:
    com.flowershop: info
